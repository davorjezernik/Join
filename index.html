<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/keyframes.css">
    <link rel="stylesheet" href="./CSS/font.css">
    <link rel="stylesheet" href="./CSS/signupLoginResponsive.css">
    <title>Log in</title>
    <link rel="icon" type="image/x-icon" href="./img/Capa 2.png">
</head>

<body>
    <div id="wrongPasswordContainer" class="wrong-password-container d-none">
        <div id="wrongPassword" class="wrong-password">Wrong password! Try again.</div>
    </div>
    <img class="intro-img" src="./img/Capa 2.png">
    <div class="background-animation"></div>
    <img class="intro-img-responsive" src="./img/Capa2White.png">
    <main class="background">
        <form onsubmit="logIn(); return false" novalidate class="main-container">
            <div class="login-headline">Log in</div>
            <div class="blue-seperator"></div>
            <section class="data-container">
                <input id="loginEmail" placeholder="Email" required class="email-input margin-input" type="email">
                <div class="password-container">
                    <input id="loginPassword" placeholder="Password" required class="password-input margin-input margin-8" type="password">
                    <div class="toggle-password" onclick="togglePassword('loginPassword')"></div>
                </div>
                <div class="remember-container">
                    <input type="checkbox" id="rememberMeCheckbox" class="remember-me-checkbox">
                    <label for="rememberMeCheckbox" class="remember-text">Remember me</label>
                </div>
                <div id="loginErrorMsg" class="error-message" style="color: red;"></div>
                <div class="login-buttons-container">
                    <button class="login-button pointer color-blue-button font-size-21">Log in</button>
                    <button type="button" onclick="guestLogin()" class="guest-button pointer color-white-button font-size-21">Guest log in</button>
                </div>
                </div>
            </section>
        </form>
        <section class="not-user-container">
            <div class="not-user-text">Not a Join user?</div>
            <a href="signup.html"><button class="sign-up-button pointer color-blue-button font-size-21">Sign up</button></a>
        </section>
        <section class="legal-privacy-container">
            <a href="privacyPolicyExtern.html" class="privacy-policy-extern">Privacy policy</a>
            <a href="legalNoticeExtern.html" class="privacy-policy-extern">Legal notice</a>
        </section>
    </main>
</body>
<script src="./JS/storage.js"></script>
<script src="./JS/login.js"></script>

</html>

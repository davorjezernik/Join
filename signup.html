<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/font.css">
    <link rel="stylesheet" href="./CSS/signupLoginResponsive.css">
    <link rel="stylesheet" href="./CSS/legalPolicyExtern.css">
    <link rel="stylesheet" href="./CSS/responsive.css">
    <title>Sign up</title>
    <link rel="icon" type="image/x-icon" href="./img/Capa 2.png">
</head>

<body>
    <header class="header-login">
        <img class="static-img-signup logo-desktop" src="./img/Capa 2.png">
    </header>
    <img class="static-img-phone-signup" src="./img/Capa 2.png">
    <main class="background">
        <form onsubmit="handleSubmit(event)" novalidate class="main-container-signup">
            <section class="header">
                <div class="arrowcontainer">
                    <a href="index.html">
                        <img class="arrow-left-line" src="./img/arrow-left-line.png">
                    </a>
                </div>
                <div class="aot-signup-container">
                    <div class="text-container">
                        <div class="signup-headline">Sign up</div>
                        <div class="blue-seperator"></div>
                    </div>
                </div>
            </section>
            <section class="data-container">

                <div class="name-container-signup">
                    <div class="input-with-icon">
                        <input id="name" placeholder="Name" type="text" required class="name-input margin-input" onblur="validateName()">
                        <img class="signup-icon-setup" src="./img/person.png" alt="Person icon">
                    </div>
                    <div id="nameCorrectIncorrectS" class="correct-incorrect"></div>
                </div>

                <div>
                    <div class="input-with-icon">
                        <input id="email" placeholder="Email" type="email" required class="email-input margin-input" onblur="validateEmailS()">
                        <img class="signup-icon-setup" src="./img/mail.png" alt="Mail icon">
                    </div>
                    <div id="emailCorrectIncorrectS" class="correct-incorrect"></div>
                </div>

                <div>
                <div class="password-container">
                    <div class="input-with-icon">
                        <input id="password" placeholder="Password" type="password" required class="password-input margin-input" onblur="validatePassword(this)"/>
                        <img class="signup-icon-setup" src="./img/lock.png" alt="Lock icon">
                        <div class="toggle-password" onclick="togglePassword('password')"></div>
                    </div>
                </div>
                <div id="passwordOneCorrectIncorrect" class="correct-incorrect"></div>
                </div>

                <div>
                <div class="password-container">
                    <div class="input-with-icon">
                        <input id="confirmedPassword" placeholder="Confirm Password" type="password" required class="password-input margin-input" onblur="validatePassword(this)"/>
                        <img class="signup-icon-setup" src="./img/lock.png" alt="Lock icon">
                        <div class="toggle-password" onclick="togglePassword('confirmedPassword')"></div>
                    </div>
                </div>
                <div id="passwordTwoCorrectIncorrect" class="correct-incorrect"></div>
                </div>


            </section>
            <section class="accept-policy-container">
                <div class="accept-container">
                    <input id="acceptPolicy" class="accept-policy-checkbox" type="checkbox" required>
                    <div id="acceptText" class="accept-text">I accept the<a href="privacyPolicyExtern.html" class="policy-link"> Privacy policy</a></div>
                </div>
                <div id="policyErrorMsg" class="error-message" style="color: red;"></div>
            </section>
            <button class="sign-up-button pointer color-blue-button font-size-21" type="submit" disabled>
                Sign up
            </button>     
        </form>
        <section class="legal-privacy-container">
            <a href="privacyPolicyExtern.html" class="privacy-policy-extern">Privacy policy</a>
            <a href="legalNoticeExtern.html" class="privacy-policy-extern">Legal notice</a>
        </section>
    </main>
    <div id="successfull-container" class="signup-successful-container d-none">
        <div id="succesfull-signup" class="succesfull-signup">You signed up successfully</div>
    </div>
</body>
<script src="./JS/storage.js"></script>
<script src="./JS/signup.js"></script>
<script src="./JS/contacts.js"></script>

</html>
